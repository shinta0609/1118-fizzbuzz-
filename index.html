<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FizzBuzz (1 - 50)</title>
  <style>
    :root {
      --bg-page: #f8fafc;
      --text-main: #0f172a;
      --text-muted: #64748b;

      --num-bg: #ffffff;
      --num-border: #e2e8f0;
      --num-text: #334155;

      --fizz-bg: #eff6ff;
      --fizz-border: #93c5fd;
      --fizz-text: #1d4ed8;

      --buzz-bg: #fefce8;
      --buzz-border: #fde047;
      --buzz-text: #a16207;

      --fizzbuzz-bg: #fdf2f8;
      --fizzbuzz-border: #f472b6;
      --fizzbuzz-text: #be185d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-page);
      color: var(--text-main);
      min-height: 100vh;
      padding: 2.5rem 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 960px;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    h1 {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 0.75rem;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.75rem;
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      font-weight: 600;
      border: 1px solid transparent;
    }

    .badge-num {
      background-color: var(--num-bg);
      border-color: var(--num-border);
      color: var(--num-text);
    }

    .badge-fizz {
      background-color: var(--fizz-bg);
      border-color: var(--fizz-border);
      color: var(--fizz-text);
    }

    .badge-buzz {
      background-color: var(--buzz-bg);
      border-color: var(--buzz-border);
      color: var(--buzz-text);
    }

    .badge-fizzbuzz {
      background-color: var(--fizzbuzz-bg);
      border-color: var(--fizzbuzz-border);
      color: var(--fizzbuzz-text);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(84px, 1fr));
      gap: 0.75rem;
    }

    @media (min-width: 900px) {
      .grid {
        grid-template-columns: repeat(10, 1fr);
      }
    }

    .card {
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 0.75rem;
      font-weight: 700;
      font-size: 1.125rem;
      border: 2px solid transparent;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.05);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      user-select: none;
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.08);
    }

    .item-number {
      background-color: var(--num-bg);
      border-color: var(--num-border);
      color: var(--num-text);
    }

    .item-fizz {
      background-color: var(--fizz-bg);
      border-color: var(--fizz-border);
      color: var(--fizz-text);
    }

    .item-buzz {
      background-color: var(--buzz-bg);
      border-color: var(--buzz-border);
      color: var(--buzz-text);
    }

    .item-fizzbuzz {
      background-color: var(--fizzbuzz-bg);
      border-color: var(--fizzbuzz-border);
      color: var(--fizzbuzz-text);
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>FizzBuzz (1 - 50)</h1>
      <div class="legend" aria-label="凡例">
        <span class="badge badge-num">数字 (通常)</span>
        <span class="badge badge-fizz">Fizz (3の倍数)</span>
        <span class="badge badge-buzz">Buzz (5の倍数)</span>
        <span class="badge badge-fizzbuzz">FizzBuzz (15の倍数)</span>
      </div>
    </header>

    <main id="fizzbuzz-grid" class="grid" aria-label="FizzBuzz 1から50の結果"></main>
  </div>

  <script>
    function getFizzBuzzItem(n) {
      if (n % 15 === 0) {
        return { text: 'FizzBuzz', className: 'item-fizzbuzz' };
      }
      if (n % 3 === 0) {
        return { text: 'Fizz', className: 'item-fizz' };
      }
      if (n % 5 === 0) {
        return { text: 'Buzz', className: 'item-buzz' };
      }
      return { text: String(n), className: 'item-number' };
    }

    function renderFizzBuzz(start = 1, end = 50) {
      const grid = document.getElementById('fizzbuzz-grid');
      const fragment = document.createDocumentFragment();

      for (let i = start; i <= end; i++) {
        const { text, className } = getFizzBuzzItem(i);
        const card = document.createElement('div');
        card.className = `card ${className}`;
        card.textContent = text;
        card.title = `${i}: ${text}`;
        fragment.appendChild(card);
      }

      grid.appendChild(fragment);
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderFizzBuzz(1, 50);
    });
  </script>
</body>
</html>
